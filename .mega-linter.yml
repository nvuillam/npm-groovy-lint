# Configuration file for Mega-Linter
# See all available variables at https://megalinter.io/#configuration and in linters documentation
#
# This repository uses a MegaLinter custom flavor (https://megalinter.io/latest/custom-flavors/)
# instead of a standard flavor, so MEGALINTER_FLAVOR / MEGALINTER_VERSION are intentionally not set:
# the custom flavor image follows the latest MegaLinter major (v10), and is rebuilt in
# nvuillam/megalinter-custom-flavor-npm-groovy-lint each time MegaLinter publishes a new version.
# CI uses the action nvuillam/megalinter-custom-flavor-npm-groovy-lint@main ; to run locally:
# npx mega-linter-runner --image ghcr.io/nvuillam/megalinter-custom-flavor-npm-groovy-lint/megalinter-custom-flavor:latest

APPLY_FIXES: "all" # When true, APPLY_FIXES must also be defined as environment variable (in github/workflows/mega-linter.yml or other CI tool)
# Note: keep every alternative of FILTER_REGEX_EXCLUDE a plain literal (no lookahead, no nested
# group): MegaLinter derives the directories it forwards to project-mode linters by splitting this
# alternation, and a non-literal group makes it forward nothing at all.
# .github/workflows is deliberately NOT excluded, so ACTION_ZIZMOR can audit the workflows.
FILTER_REGEX_EXCLUDE: (lib/example|\.github/linters|\.github/FUNDING\.yml|\.vscode|\.claude|CLAUDE\.md|pull_request_template|docs/javascripts|package-lock\.json)
DISABLE:
  - COPYPASTE
  - CSS
JAVASCRIPT_DEFAULT_STYLE: prettier
DISABLE_LINTERS:
  - JAVASCRIPT_STANDARD
  - TYPESCRIPT_STANDARD
DISABLE_ERRORS_LINTERS:
  - REPOSITORY_SEMGREP
  - SPELL_LYCHEE
FLAVOR_SUGGESTIONS: true
JAVASCRIPT_ES_CONFIG_FILE: "LINTER_DEFAULT"
GITHUB_STATUS_REPORTER: false
PRE_COMMANDS:
  - continue_if_failed: false
    command: npm ci
    cwd: workspace
