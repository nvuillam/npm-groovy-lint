name: Update check

on:
  push:
    tags:
      - v*
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Check for changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install node
        # zizmor: ignore[cache-poisoning] no cache: input is set, so setup-node restores and writes nothing
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.x"

      - name: Install groovy
        uses: sdkman/sdkman-action@b1f9b696c79148b66d3d3a06f7ea801820318d0f
        with:
          candidate: groovy
          version: 4.0.33

      - name: Install dependencies and link
        run: |
          npm ci
          npm link

      - name: Check production dependency count
        run: node scripts/check-dependencies.js

      - name: Validate no changes
        run: |
          npm run dev:pre-commit
          git --no-pager diff
          [[ 0 -eq $(git status --porcelain | wc -l) ]] || echo "Validation issue: stevenh help ! :("

      # Upload Mega-Linter artifacts
      - name: Archive production artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Expected sources
          path: |
            docs/
            groovy/
            lib/
